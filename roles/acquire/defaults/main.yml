---
# NTP servers for chrony, replacing the distribution's chrony.conf. Empty
# leaves the existing configuration alone; optical-acquire only needs chrony
# to report a validated clock. Emptying it again later does not restore the
# distribution's file.
optical_ntp_servers: []

optical_venv: /opt/satnogs-optical/venv

optical_publish_interval: 10
optical_config_pull_interval: 30

# Extra station.toml content, as section -> key -> value. Merged over what
# this role writes, and over optical_station_toml_extra (which both hosts
# get). Most settings are better changed in the web UI, which reaches this
# host through config-pull and outranks station.toml.
optical_acquire_toml_extra: {}
optical_station_toml_extra: {}
