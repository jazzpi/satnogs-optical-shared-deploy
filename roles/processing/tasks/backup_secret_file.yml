---
# Re-encrypting identical content yields different ciphertext, so a file is
# only rewritten when its decrypted content changed: otherwise every backup
# would show up as a diff in git.
- name: Compare with the stored copy
  vars:
    dest: "{{ optical_secrets_dir }}/{{ inventory_hostname }}/{{ optical_secret.item }}"
  ansible.builtin.set_fact:
    optical_secret_dest: "{{ dest }}"
    optical_secret_changed: >-
      {{ dest is not file
         or lookup('ansible.builtin.file', dest) != (optical_secret.content | b64decode).rstrip('\n') }}
  no_log: true

- name: Write and encrypt {{ optical_secret.item }}
  when: optical_secret_changed | bool
  delegate_to: localhost
  become: false
  block:
    - name: Directory
      ansible.builtin.file:
        path: "{{ optical_secret_dest | dirname }}"
        state: directory
        mode: "0700"

    - name: Plaintext, briefly
      ansible.builtin.copy:
        dest: "{{ optical_secret_dest }}"
        content: "{{ optical_secret.content | b64decode }}"
        mode: "0600"
      no_log: true

    - name: Encrypt
      ansible.builtin.command:
        argv: [ansible-vault, encrypt, "{{ optical_secret_dest }}"]
      changed_when: true
