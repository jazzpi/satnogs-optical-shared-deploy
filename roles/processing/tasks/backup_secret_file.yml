---
# Re-encrypting identical content yields different ciphertext, so a file is
# only rewritten when its decrypted content changed: otherwise every backup
# would show up as a diff in git.
- name: Compare with the stored copy
  vars:
    dest: "{{ optical_secrets_dir }}/{{ inventory_hostname }}/{{ optical_secret.item }}"
  ansible.builtin.set_fact:
    optical_secret_dest: "{{ dest }}"
    optical_secret_changed: >-
      {{ dest is not file
         or lookup('ansible.builtin.file', dest) != (optical_secret.content | b64decode).rstrip('\n') }}
  no_log: true

- name: Write and encrypt {{ optical_secret.item }}
  when: optical_secret_changed | bool
  delegate_to: localhost
  become: false
  block:
    - name: Directory
      ansible.builtin.file:
        path: "{{ optical_secret_dest | dirname }}"
        state: directory
        mode: "0700"

    # From stdin, so the plaintext never touches this machine's disk.
    # ansible-vault runs in the module's working directory, where it may not
    # find the playbook's ansible.cfg, so the password file comes from the
    # environment (which, unlike --vault-password-file, does not add a second
    # vault id when it does find the file).
    - name: Encrypt
      ansible.builtin.command:
        argv: [ansible-vault, encrypt, --output, "{{ optical_secret_dest }}", "-"]
        stdin: "{{ optical_secret.content | b64decode }}"
        stdin_add_newline: false
      environment:
        ANSIBLE_VAULT_PASSWORD_FILE: "{{ lookup('ansible.builtin.config', 'DEFAULT_VAULT_PASSWORD_FILE') }}"
      register: optical_vault_encrypt
      changed_when: true
      failed_when: false
      no_log: true

    # no_log hides the whole result; ansible-vault's stderr never contains
    # the plaintext, so it is safe to show.
    - name: Check the encryption worked
      ansible.builtin.assert:
        that: optical_vault_encrypt.rc | default(1) == 0
        fail_msg: >-
          ansible-vault failed (rc {{ optical_vault_encrypt.rc }}):
          {{ optical_vault_encrypt.stderr | default(optical_vault_encrypt.msg | default('')) }}
        quiet: true
