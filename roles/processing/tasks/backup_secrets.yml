---
- name: Check where to put the backup
  ansible.builtin.assert:
    that:
      - optical_secrets_dir is defined
      - lookup('ansible.builtin.config', 'DEFAULT_VAULT_PASSWORD_FILE') | default('', true) | length > 0
    fail_msg: >-
      Set optical_secrets_dir, and configure a vault password file
      (vault_password_file in ansible.cfg or ANSIBLE_VAULT_PASSWORD_FILE):
      the files are encrypted before they are written.
    quiet: true

- name: Read the secrets
  ansible.builtin.slurp:
    src: "{{ optical_config_dir }}/{{ item }}"
  loop: "{{ optical_secret_files }}"
  register: optical_secrets
  failed_when: false
  no_log: true

- name: Store each one encrypted
  ansible.builtin.include_tasks: backup_secret_file.yml
  loop: "{{ optical_secrets.results | selectattr('content', 'defined') | list }}"
  loop_control:
    loop_var: optical_secret
    label: "{{ optical_secret.item }}"
