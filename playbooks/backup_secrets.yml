---
# Copies the processing host's station identity, token and admin token into
# optical_secrets_dir/<host>/ on this machine, vault-encrypted, so a rebuilt
# host is the same station. Needs a vault password file (vault_password_file
# in ansible.cfg, or ANSIBLE_VAULT_PASSWORD_FILE).
- name: Back up station secrets
  hosts: optical_processing
  become: true
  tasks:
    - name: Back up
      ansible.builtin.include_role:
        name: jazzpi.satnogs_optical_split.processing
        tasks_from: backup_secrets
